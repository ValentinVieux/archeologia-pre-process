# Mapping GPKG entités — 55_verdun (grand_est), audit du 2026-09-09 (12 inconnus classés, 0 restant).
# Deux entités, chantier crateres_tranchees_v2 (deux modèles segmentation d'instances sur LD 0,5 m) :
#  - cratere : training/vecteurs/couche_regroupee.gpkg = la couche VALIDÉE (Sorbonne, 2025) déjà utilisée
#    pour les modèles cratere_circulaire_2 / verdun_3_classes_1 — 1 MultiPolygon dissous de 731 905 parties
#    -> exploser (attributs écartés : ils décrivent le tout). Composition mesurée le 2026-09-09 par
#    jointure spatiale : d1 (100 %), d2 (97 %), d4 (100 %), d5 (100 %), d3 (86 %), d6 (36 %), ~rien de
#    d7/d8, + 83 047 parties absentes de TOUS les d-fichiers (Ø médian 2,52 m, toute la zone) : NON
#    reproductible depuis raw/Verdun_Shp, c'est la source de référence (décision utilisateur 2026-09-09).
#    Ø éq. médian 2,29 m (p10 1,33, p90 3,84) ; inclut les cratères coalescents (d2-d5, allongés).
#  - tranchees_et_boyaux : raw/Verdun_Shp/tranchees_et_boyaux.shp, champ 'layer' (boyaux_zonal 11 704 +
#    tranchees_zonal 5 662) = fond de tranchée segmenté, rubans ~1,3 m (2A/P p50), gardés TELS QUELS
#    (décision utilisateur 2026-09-09 : ni buffer 7 m, ni fermeture morphologique — testés et rejetés).
# Les 8 shapefiles d1-d8 sont des catégories morphologiques de la segmentation (d1 = 591 660 objets
# circulaires Ø 2,3 m ; d2-d8 = 73 000 objets plus grands/allongés), pas des sources : ignorés dans
# aliases.yaml, comme les chemins d'origine QGIS du champ 'path'.
# Dossier source local (copie octet-identique) : D:/brouillons/crateres_tranchees_v2/55_verdun/source
#   # = Drive 55_verdun/raw/Verdun_Shp/tranchees_et_boyaux.* + training/vecteurs/couche_regroupee.gpkg
gpkg_nom: 55_verdun_entites_l93_v1.gpkg
crs: 2154
sources:
  couche_regroupee.gpkg:
    entite: cratere
    exploser: true
  tranchees_et_boyaux.shp:
