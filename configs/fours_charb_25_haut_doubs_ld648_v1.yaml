# Corpus fours/charbonnières v1 — Haut-Doubs (labels COCO dispatché -> ellipses,
# fusion fours -> four ; le GPKG fours_a_chaux_dou (doublon 954 suspect avec Alès)
# n'est PAS utilisé : le COCO dispatché fait foi). LD 0,5 m (VRT des jpg).
dataset: fours_charb_25_haut_doubs_ld648_v1
zone: bourgogne_franche_comte/25_haut_doubs
raster: D:/entrainement_ponctuelles/zones/25_haut_doubs/ld.vrt  # LD livré à géoréf FAUSSE (incident 2026-09-06) : dataset PÉRIMÉ ; version corrigée = Drive <zone>/raw/MNT/LD_livre_dalles.vrt, LD de référence = raw/MNT/haut_doubs_ld.tif
gpkg: D:/entrainement_ponctuelles/zones/25_haut_doubs/annotations_coco.gpkg  # annotations v1 à géoréf FAUSSE, NON déposées (dataset PÉRIMÉ) ; état corrigé + dédoublonné = Drive <zone>/training/vecteurs/25_haut_doubs_entites_l93_v4.gpkg
couches:
  charbonniere:
    classe: charbonniere
  four:
    classe: four
  circular_depression:
    classe: circular_depression
tuile_px: 648
bloc_m: 2000
split:
  train: 70
  valid: 20
  test: 10
negatifs_pct: 10
min_couverture_valide: 0.5
min_visibilite_annotation: 0.5
nodata_supplementaire: 0
assign_crs: null
