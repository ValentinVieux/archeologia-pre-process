# Corpus enclos FRANCE — variante multicanal CSL (R:cvat_combined G:slrm_r10±0,5 B:ld_v1).
# Mêmes tuiles/splits/annotations que enclos_fr_648_v1 (datasets repeints par
# tools\repeindre_dataset.py) : l'ÉVAL FRANÇAISE GELÉE (eval_fr_gelee_v1.yaml,
# listes nominatives) reste valable telle quelle.
# Usage : .venv\Scripts\python.exe tools\build_corpus.py configs\corpus_enclos_fr_csl_v1.yaml
#         datasets [--out <dossier>]
corpus: enclos_fr_648_csl_v1
classes: [enclos_circulaire]
gsd_m: 1.0
rvt: LD
fusions: {}
datasets:
  - enclos_fr_bretagne_csl648_v1
  - enclos_fr_rambouillet_csl648_v1
  - enclos_fr_fontainebleau_csl648_v1
  - enclos_fr_saint_germain_csl648_v1
