# Recalage 78_rambouillet (spec 2026-07-28-recalage-vecteurs-design.md)
# Usage : .venv\Scripts\python.exe tools\recaler_lignes.py configs\recalage_rambouillet.yaml
#         <copie locale du GPKG entites> <VRT LD> --out <dossier>
# amenagement_militaire non recalée (couche ignorée à l'entraînement).
# Fenêtre 8 m par défaut (qualité de digitalisation inconnue) — à réduire si
# la revue montre le motif « annotations justes dérangées » (cf. Fontainebleau).
zone: 78_rambouillet
raster_gsd_attendu: 0.5
couches:
  parcellaire: {polarite: clair, fenetre_m: 8.0, pas_m: 2.0, seuil_contraste: 10,
                poids_distance: 2.0}
  # talus : polarité variable par ligne constatée à Fontainebleau -> auto
  talus: {polarite: auto, fenetre_m: 8.0, pas_m: 2.0, seuil_contraste: 10,
          poids_distance: 2.0}
  fosse: {polarite: sombre, fenetre_m: 8.0, pas_m: 2.0, seuil_contraste: 10,
          poids_distance: 2.0}
  # fossé+talus indistincts : la convention sombre de Haye NE tient PAS ici —
  # session 1 (40 décisions talus_fosse) : 23 « garder l'original » dont 17
  # avec l'annotation côté CLAIR. Polarité variable par ligne -> auto.
  talus_fosse: {polarite: auto, fenetre_m: 8.0, pas_m: 2.0, seuil_contraste: 10,
                poids_distance: 2.0}
  chemin_creux: {polarite: sombre, fenetre_m: 8.0, pas_m: 2.0, seuil_contraste: 10,
                 poids_distance: 2.0}
  # voie (romaine/ancienne) : agger clair ou creux d'usure selon les tronçons -> auto
  voie: {polarite: auto, fenetre_m: 8.0, pas_m: 2.0, seuil_contraste: 10,
         poids_distance: 2.0}
lissage: {poids_derivee: 4.0}
seuil_points_nets: 5
seuil_ambiguite: 0.7
# Résidu = bruit de terrain ici aussi : gain de contraste plat par tranche
# (+1,9 à +2,7, 87-92 % positif, 360 lignes échantillonnées). Seuil zone à
# p90 (1,8 m) -> parcellaire 38 % -> 13 % à revoir.
seuils_statut: {residu_max_m: 1.8}
