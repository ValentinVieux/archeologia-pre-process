# ~190 digitalisations neuves issues de la prospection zéro-shot + 50 IdF),
# classe unique enclos_circulaire, LD 1 m, splits spatiaux seed 42.
# Les splits valid/test constituent l'ÉVAL FRANÇAISE GELÉE (jamais re-tirée ;
# toute extension future de GT va en train uniquement).
# Usage : .venv\Scripts\python.exe tools\build_corpus.py configs\corpus_enclos_fr_v1.yaml
#         datasets [--out <dossier>]
corpus: enclos_fr_648_v1
classes: [enclos_circulaire]
fusions: {}
datasets:
  - enclos_fr_bretagne_ld648_v1
  - enclos_fr_rambouillet_ld648_v1
  - enclos_fr_fontainebleau_ld648_v1
  - enclos_fr_saint_germain_ld648_v1
