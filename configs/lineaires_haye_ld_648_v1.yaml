# PLACEHOLDER : raster/gpkg = <copie locale> À REMPLACER par les chemins locaux réels avant exécution
# (convention délibérée — chemins propres à chaque machine ; slice_zone refuse tout chemin contenant '<')
# Dataset v2 — structures linéaires de la forêt de Haye sur indice LD (dalles LHD IGN).
# Décisions D1-D4 du 2026-07-27 : tuiles 648 px (divisible par 24, contrainte RF-DETR
# seg), mono-indice LD paramétrisation actée A15_Rmin10_Rmax20_H1p7, split spatial par
# blocs de 2 km. Chemins : COPIES LOCALES obligatoires (le script refuse G:) — adapter
# raster/gpkg à l'emplacement local avant lancement.
dataset: lineaires_haye_ld_648_v1
zone: grand_est/54_foret_de_haye
raster: <copie locale>\haye_ld\tif\index_LD_A15_Rmin10_Rmax20_H1p7_V1.vrt
gpkg: <copie locale>\haye_entites_l93.gpkg
couches:
  # buffer_m = largeur TOTALE, centrée sur l'axe (buffer_m/2 de chaque côté).
  # Calé visuellement sur les lots de test Roboflow du 2026-07-27 : 2 m trop fin,
  # 4 m encore un peu juste, 4,8 m (+20 %) acté — soit 9,6 px à 0,5 m/px.
  parcellaire:  {classe: parcellaire,  buffer_m: 4.8}
  talus_fosse:  {classe: talus_fosse,  buffer_m: 4.8}
  # DÉCISION 2026-07-27 : rempart non entraîné (choix utilisateur). `ignorer` retire la
  # classe SANS libérer ses tuiles pour les négatifs — un rempart ressemble à un talus,
  # l'exporter comme « fond » apprendrait au modèle à ignorer les levées linéaires.
  rempart:      {ignorer: true,        buffer_m: 4.8}
tuile_px: 648
bloc_m: 2000
split: {train: 70, valid: 20, test: 10}
negatifs_pct: 10
min_couverture_valide: 0.5
# fraction VALIDE (hors nodata) de la bbox d'une annotation — ne filtre PAS les
# fragments d'entités coupés par la grille : un talus traversant 10 tuiles est
# annoté dans chacune, c'est voulu (cf. doc fuite spatiale, mécanisme 2)
min_visibilite_annotation: 0.5
nodata_supplementaire: 0
assign_crs: null   # CRS EPSG:2154 embarqué dans les dalles — rien à assigner
