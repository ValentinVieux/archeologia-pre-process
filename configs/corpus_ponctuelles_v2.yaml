    n°1 du run fours_charb_seg_ld_v1_ep41)"
  - "ATTENTION: ~606 troncatures sèches aux lignes km subsistent (moitié d'objet jamais
    annotée par la source, incorrigible sans revue humaine — audit_final_2026-09-04) ;
    7 paires résiduelles non arbitrées (gt_paires_residuelles.gpkg, 14 annotations)"
  - "Corpus destiné à l'entraînement DÉTECTION bbox (résolution 672) ; les masques
    ellipses des sources bbox restent dans les COCO mais ne servent pas en détection"
datasets:
