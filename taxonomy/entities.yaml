# Taxonomie maîtresse des entités archéologiques.
# Règles (voir CLAUDE.md § Taxonomie) :
#   - id : snake_case ASCII, regex ^[a-z][a-z0-9_]*$ (contrat du plugin archeologia-pipeline)
#   - morphology : circulaire | lineaire | zone
#   - status : canonical | candidate  (Claude ne crée QUE des candidate)
#   - plugin_entity_id : id dans entities_catalog.json du plugin QGIS, ou null
#   - roboflow_classes : noms de classes Roboflow VERBATIM (accents/typos conservés)
# Ne JAMAIS renommer un id canonical sans vérifier le plugin (_ENTITY_ID_RENAMES) et Roboflow.
schema_version: 1
entities:
  # ---- Entités canoniques du plugin QGIS (entities_catalog.json, schema_version 2) ----
  - id: cratere
    label_fr: Cratères
    morphology: circulaire
    status: canonical
    plugin_entity_id: cratere
    roboflow_classes: ["trou d'obus"]
  - id: tranchees_et_boyaux
    label_fr: Tranchées et boyaux
    morphology: lineaire
    status: canonical
    plugin_entity_id: tranchees_et_boyaux
    roboflow_classes: ["tranchée"]
  - id: abri
    label_fr: Abris
    morphology: circulaire
    status: canonical
    plugin_entity_id: abri
    roboflow_classes: ["abri"]
  - id: chemin_creux
    label_fr: Chemins creux
    morphology: lineaire
    status: canonical
    plugin_entity_id: chemin_creux
    roboflow_classes: ["chemin creux"]
  - id: parcellaire
    label_fr: Parcellaire
    morphology: lineaire
    status: canonical
    plugin_entity_id: parcellaire
    roboflow_classes: ["parcellaires"]
  # DÉCISION utilisateur 2026-07-27 : fin de la fusion talus/fossé — deux classes
  # distinctes `talus` et `fosse` pour toute source qui les distingue (Fontainebleau).
  # `talus_fosse` est CONSERVÉ pour les sources fusionnées indissociables (Haye
  # fossébutte) et le contrat plugin (plugin_entity_id) — ne pas supprimer.
  - id: talus_fosse
    label_fr: Talus et fossés
    morphology: lineaire
    status: canonical
    plugin_entity_id: talus_fosse
    roboflow_classes: ["fossé", "fossébutte"]
  - id: talus
    label_fr: Talus
    morphology: lineaire
    status: canonical  # décision utilisateur 2026-07-27 (split talus/fosse)
    plugin_entity_id: null
    roboflow_classes: []
  - id: fosse
    label_fr: Fossés
    morphology: lineaire
    status: canonical  # décision utilisateur 2026-07-27 (split talus/fosse)
    plugin_entity_id: null
    roboflow_classes: []
  - id: charbonniere
    label_fr: Charbonnières
    morphology: circulaire
    status: canonical
    plugin_entity_id: charbonniere
    roboflow_classes: ["charbonnières"]
  - id: four
    label_fr: Fours à chaux
    morphology: circulaire
    status: canonical
    plugin_entity_id: four
    roboflow_classes: ["fours"]
  - id: circular_depression
    label_fr: Dépressions circulaires
    morphology: circulaire
    status: canonical
    plugin_entity_id: circular_depression
    roboflow_classes: ["dépressions circulaires"]
  - id: regroupement_crateres
    label_fr: Regroupement de cratères
    morphology: zone
    status: canonical
    plugin_entity_id: regroupement_crateres
    roboflow_classes: []

